<body>

        <h1>Dados Locos</h1>

        <div class="container">

            </form>

            <div id="img-dado-1"></div>
            <div id="img-dado-2"></div>

            <button type="button" id="tirar-dado" disabled>Tirar dado</button>

            <div id="tabla-puntajes"></div>

            <a href="index.html" class="volver">Volver al Inicio</a>
    
         </div>

    <script src="js/dados.js"></script>
