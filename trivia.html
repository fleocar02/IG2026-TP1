<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/estilos.css" />
    <!--Fuente Roboto-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juegazos 🕹️ PokeTrivia</title>
  </head>

  <body class="body-trivia">
    <div class="container">
      <header>
        <nav class="menu">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="dados.html">Dados</a></li>
            <li><a href="trivia.html">Preguntas</a></li>
            <li><a href="cartas.html">Cartas</a></li>
            <li><a href="puntajes.html">Puntajes</a></li>
            <li><a href="nosotros.html">Sobre nosotros</a></li>
          </ul>
        </nav>
      </header>
      
      <main>
        <h1>PokeTrivia</h1>
        <p id="estado" class="gris">Iniciando...</p>

        <section id="entrenador" class="oculto">
          <h2>¡Bienvenido a tu aventura Pokemon!</h2>
          <p>Ingresá tu nombre de entrenador para jugar la trivia</p>
          <div>
            <input type="text" id="nombre-entrenador" placeholder="Nombre de entrenador"/>
            <button id="comenzar" type="button">Comenzar</button>
          </div>
        </section>

        <section id="seleccion" class="oculto">
          <h3>¡Elegí tu Pokémon!</h3>
          <div id="lista-pokemon"></div>
        </section>

        <section id="juego" class="oculto">
          <small id="progreso"></small>
          <h4 id="pregunta"></h4>

          <div id="opciones"></div>

          <div id="resultado"></div>
          <button id="siguiente" hidden>Siguiente pregunta</button>
        </section>

        <section id="final" class="oculto">
          <h5>¡Trivia terminada!</h5>
          <p id="puntaje"></p>
          <button id="reiniciar" hidden>Elegir otro Pokémon</button>
        </section>
        <button id="reintentar" type="button" hidden>Intentar nuevamente</button>
      </main>

      <footer>
        <address>Informatica General 2026</address>
      </footer>
    </div>

    </div>
    <script src="js/trivia.js"></script>
  </body>
</html>
